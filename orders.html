<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - CodeAlpha Store</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f1e8;
            color: #222;
        }


        /* NAVBAR */

        nav {
            background: #071a35;
            color: white;

            padding: 18px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            color: #d4af37;

            font-size: 25px;

            font-weight: bold;
        }


        nav a {
            color: white;

            text-decoration: none;

            margin-left: 20px;
        }


        /* MAIN */

        .container {

            width: 85%;
            max-width: 1000px;

            margin: 40px auto;
        }


        h1 {

            color: #071a35;

            margin-bottom: 25px;
        }


        /* ORDER CARD */

        .order-card {

            background: white;

            padding: 25px;

            margin-bottom: 25px;

            border-radius: 12px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.1);
        }


        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid #ddd;

            padding-bottom: 15px;

            margin-bottom: 20px;
        }


        .order-id {

            color: #071a35;

            font-weight: bold;
        }


        .status {

            background: #fff3c4;

            color: #071a35;

            padding: 7px 12px;

            border-radius: 20px;

            font-weight: bold;

            font-size: 14px;
        }


        /* PRODUCT */

        .product {

            display: flex;

            align-items: center;

            gap: 20px;

            margin-bottom: 15px;
        }


        .product img {

            width: 90px;

            height: 90px;

            object-fit: cover;

            border-radius: 8px;
        }


        .product-info {

            flex: 1;
        }


        .product-info h3 {

            color: #071a35;

            margin-bottom: 8px;
        }


        .product-info p {

            color: #666;

            font-size: 14px;
        }


        .product-price {

            font-weight: bold;

            color: #071a35;
        }


        /* ORDER FOOTER */

        .order-footer {

            border-top: 1px solid #ddd;

            padding-top: 20px;

            margin-top: 20px;
        }


        .row {

            display: flex;

            justify-content: space-between;

            margin-bottom: 12px;
        }


        .total {

            font-size: 20px;

            font-weight: bold;

            color: #071a35;
        }


        /* TRACK BUTTON */

        .track-btn {

            display: inline-block;

            margin-top: 15px;

            padding: 12px 20px;

            background: #071a35;

            color: white;

            text-decoration: none;

            border-radius: 6px;
        }


        .track-btn:hover {

            background: #d4af37;

            color: #071a35;
        }


        /* EMPTY */

        .empty {

            background: white;

            text-align: center;

            padding: 50px;

            border-radius: 12px;
        }


        .empty a {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 20px;

            background: #071a35;

            color: white;

            text-decoration: none;

            border-radius: 6px;
        }


        /* MOBILE */

        @media(max-width: 600px) {

            nav {

                flex-direction: column;

                gap: 15px;
            }


            .order-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 10px;
            }


            .product {

                flex-direction: column;

                align-items: flex-start;
            }

        }
    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            CodeAlpha Store
        </div>


        <div>

            <a href="home.html">
                Home
            </a>


            <a href="cart.html">
                Cart 🛒
            </a>

        </div>

    </nav>



    <!-- MAIN -->

    <div class="container">

        <h1>
            📦 My Orders
        </h1>


        <div id="ordersContainer"></div>

    </div>



    <script>

        /*
            Checkout page ne latest order ko
            localStorage me save kiya tha.
    
            Ab hum wahi order read karenge.
        */


        const ordersContainer =
            document.getElementById("ordersContainer");


        const latestOrder =
            JSON.parse(
                localStorage.getItem("latestOrder")
            );



        /* AGAR ORDER NAHI HAI */

        if (!latestOrder) {

            ordersContainer.innerHTML = `

            <div class="empty">

                <h2>
                    No Orders Yet 📦
                </h2>

                <p>
                    You haven't placed any order yet.
                </p>

                <a href="home.html">
                    Start Shopping
                </a>

            </div>

        `;

        }



        /* ORDER SHOW KARNA */

        else {

            let productsHTML = "";


            latestOrder.products.forEach(function (item) {

                productsHTML += `

                <div class="product">

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >


                    <div class="product-info">

                        <h3>
                            ${item.name}
                        </h3>

                        <p>
                            Quantity: ${item.quantity}
                        </p>

                    </div>


                    <div class="product-price">

                        ₹${item.price * item.quantity}

                    </div>

                </div>

            `;

            });



            ordersContainer.innerHTML = `

            <div class="order-card">


                <div class="order-header">

                    <div>

                        <div class="order-id">

                            Order ID:
                            ${latestOrder.orderId}

                        </div>


                        <small>

                            ${latestOrder.date}

                        </small>

                    </div>


                    <div class="status">

                        ${latestOrder.status}

                    </div>

                </div>



                <!-- PRODUCTS -->

                ${productsHTML}



                <!-- ORDER DETAILS -->

                <div class="order-footer">


                    <div class="row">

                        <span>
                            Payment
                        </span>

                        <span>
                            ${latestOrder.paymentMethod}
                        </span>

                    </div>


                    <div class="row">

                        <span>
                            Subtotal
                        </span>

                        <span>
                            ₹${latestOrder.subtotal}
                        </span>

                    </div>


                    <div class="row">

                        <span>
                            Delivery
                        </span>

                        <span>

                            ${latestOrder.delivery === 0
                    ? "FREE"
                    : "₹" + latestOrder.delivery
                }

                        </span>

                    </div>


                    <div class="row total">

                        <span>
                            Total
                        </span>

                        <span>
                            ₹${latestOrder.total}
                        </span>

                    </div>



                    <a
                        href="tracking.html?id=${latestOrder.orderId}"
                        class="track-btn"
                    >
                        Track Order
                    </a>


                </div>


            </div>

        `;

        }

    </script>


</body>

</html>
