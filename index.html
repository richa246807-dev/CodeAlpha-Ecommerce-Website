<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha Ecommerce</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #07152f;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 90%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

        }


        .logo {

            text-align: center;

            color: #b8860b;

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        h2 {

            text-align: center;

            color: #07152f;

            margin-bottom: 25px;

        }


        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;

        }


        button {

            width: 100%;

            padding: 14px;

            background: #d4af37;

            color: #07152f;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #b8860b;

        }


        .switch {

            text-align: center;

            margin-top: 20px;

            color: #555;

        }


        .switch span {

            color: #b8860b;

            font-weight: bold;

            cursor: pointer;

        }


        #message {

            text-align: center;

            margin-top: 15px;

            color: red;

        }
    </style>

</head>


<body>


    <div class="container">


        <div class="logo">

            CODEALPHA ECOMMERCE

        </div>


        <h2 id="title">

            Login

        </h2>


        <!-- NAME -->

        <input type="text" id="name" placeholder="Enter your name" style="display:none;">


        <!-- EMAIL -->

        <input type="email" id="email" placeholder="Enter your email">


        <!-- PASSWORD -->

        <input type="password" id="password" placeholder="Enter your password">


        <button id="mainButton">

            Login

        </button>


        <div class="switch">

            <span id="switchText">

                Don't have an account? Register

            </span>

        </div>


        <p id="message"></p>


    </div>



    <!-- FIREBASE -->

    <script type="module" >


        /* =========================
           FIREBASE IMPORT
        ========================= */

        import { initializeApp }

            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {

            getAuth,

            createUserWithEmailAndPassword,

            signInWithEmailAndPassword

        }

            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {

            getFirestore,

            collection,

            addDoc

        }

            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



        /* =========================
           FIREBASE CONFIG
        ========================= */

            const firebaseConfig = {
                apiKey: "AIzaSyChL2vpy-cccE4rBO6VKKqGe5Gr6Y16H5Q",
                authDomain: "codealphaecommerce.firebaseapp.com",
                projectId: "codealphaecommerce",
                storageBucket: "codealphaecommerce.firebasestorage.app",
                messagingSenderId: "426356427730",
                appId: "1:426356427730:web:7ccb5898025a3264ccd60b"
            };

        /* =========================
           FIREBASE START
        ========================= */

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);



        /* =========================
           GET HTML ELEMENTS
        ========================= */

        const title =
            document.getElementById("title");

        const name =
            document.getElementById("name");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const mainButton =
            document.getElementById("mainButton");

        const switchText =
            document.getElementById("switchText");

        const message =
            document.getElementById("message");



        /* =========================
           LOGIN / REGISTER MODE
        ========================= */

        let registerMode = false;



        /* =========================
           SWITCH LOGIN REGISTER
        ========================= */

        switchText.addEventListener("click", function () {


            if (registerMode == false) {

                registerMode = true;

                title.innerText = "Register";

                name.style.display = "block";

                mainButton.innerText = "Register";

                switchText.innerText =
                    "Already have an account? Login";

            }

            else {

                registerMode = false;

                title.innerText = "Login";

                name.style.display = "none";

                mainButton.innerText = "Login";

                switchText.innerText =
                    "Don't have an account? Register";

            }


            message.innerText = "";

        });



        /* =========================
           LOGIN / REGISTER BUTTON
        ========================= */

        mainButton.addEventListener("click", async function () {


            const userEmail =
                email.value.trim();

            const userPassword =
                password.value.trim();


            /* =========================
               BASIC VALIDATION
            ========================= */

            if (userEmail == "" || userPassword == "") {

                message.innerText =
                    "Please enter email and password.";

                return;

            }



            /* =========================
               REGISTER
            ========================= */

            if (registerMode == true) {


                if (name.value.trim() == "") {

                    message.innerText =
                        "Please enter your name.";

                    return;

                }


                try {


                    const userCredential =
                        await createUserWithEmailAndPassword(

                            auth,

                            userEmail,

                            userPassword

                        );


                    const user =
                        userCredential.user;



                    /* SAVE USER IN FIRESTORE */

                    await addDoc(

                        collection(db, "users"),

                        {

                            name: name.value.trim(),

                            email: userEmail,

                            userId: user.uid

                        }

                    );


                    alert("Registration successful!");


                    window.location.href =
                        "home.html";


                }


                catch (error) {

                    console.log(error);

                    message.innerText =
                        error.message;

                }

            }



            /* =========================
               LOGIN
            ========================= */

            else {


                try {


                    await signInWithEmailAndPassword(

                        auth,

                        userEmail,

                        userPassword

                    );


                    window.location.href =
                        "home.html";


                }


                catch (error) {

                    console.log(error);

                    message.innerText =
                        "Invalid email or password.";

                }

            }


        });


    </script>


</body>

</html>
