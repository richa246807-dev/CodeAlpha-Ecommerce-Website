<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CodeAlpha Ecommerce</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #07152f;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .register-card {

            width: 90%;

            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.3);

        }


        .logo {

            text-align: center;

            color: #d4af37;

            background: #07152f;

            padding: 15px;

            border-radius: 8px;

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 25px;

        }


        h1 {

            text-align: center;

            color: #07152f;

            margin-bottom: 25px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            color: #07152f;

            font-weight: bold;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

        }


        input:focus {

            outline: none;

            border-color: #d4af37;

        }


        .register-btn {

            width: 100%;

            padding: 13px;

            background: #d4af37;

            color: #07152f;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

        }


        .register-btn:hover {

            background: #07152f;

            color: white;

        }


        #message {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

        }


        .login-text {

            text-align: center;

            margin-top: 20px;

            color: #666;

        }


        .login-text a {

            color: #07152f;

            font-weight: bold;

            text-decoration: none;

        }


        .login-text a:hover {

            color: #d4af37;

        }
    </style>

</head>


<body>


    <div class="register-card">


        <div class="logo">

            CODEALPHA ECOMMERCE

        </div>


        <h1>
            Create Account
        </h1>


        <!-- NAME -->

        <div class="form-group">

            <label>
                Full Name
            </label>

            <input type="text" id="name" placeholder="Enter your name">

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input type="email" id="email" placeholder="Enter your email">

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label>
                Password
            </label>

            <input type="password" id="password" placeholder="Enter password">

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <input type="password" id="confirmPassword" placeholder="Confirm password">

        </div>


        <!-- REGISTER -->

        <button class="register-btn" id="registerBtn">

            Create Account

        </button>


        <p id="message"></p>


        <p class="login-text">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </p>


    </div>



    <!-- =========================
         FIREBASE
    ========================= -->

    <script type="module">


        /* =========================
           FIREBASE IMPORT
        ========================= */

        import {

            initializeApp

        }

            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



        import {

            getAuth,

            createUserWithEmailAndPassword

        }

            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



        import {

            getFirestore,

            doc,

            setDoc

        }

            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            // SAME WORKING FIREBASE CONFIG

        };



        /* =========================
           START FIREBASE
        ========================= */

        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);



        /* =========================
           HTML ELEMENTS
        ========================= */

        const nameInput =
            document.getElementById("name");


        const emailInput =
            document.getElementById("email");


        const passwordInput =
            document.getElementById("password");


        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );


        const registerBtn =
            document.getElementById(
                "registerBtn"
            );


        const message =
            document.getElementById(
                "message"
            );



        /* =========================
           REGISTER
        ========================= */

        registerBtn.addEventListener(

            "click",

            async function () {


                /* GET VALUES */

                const name =
                    nameInput.value.trim();


                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value;


                const confirmPassword =
                    confirmPasswordInput.value;



                /* =========================
                   VALIDATION
                ========================= */

                if (
                    name === "" ||
                    email === "" ||
                    password === "" ||
                    confirmPassword === ""
                ) {

                    message.innerText =
                        "Please fill all fields.";

                    return;

                }



                /* CHECK PASSWORD */

                if (
                    password !== confirmPassword
                ) {

                    message.innerText =
                        "Passwords do not match.";

                    return;

                }



                /* PASSWORD LENGTH */

                if (password.length < 6) {

                    message.innerText =
                        "Password must be at least 6 characters.";

                    return;

                }



                try {


                    message.innerText =
                        "Creating account...";



                    /* CREATE FIREBASE ACCOUNT */

                    const result =
                        await createUserWithEmailAndPassword(

                            auth,

                            email,

                            password

                        );



                    /* GET USER */

                    const user =
                        result.user;



                    /* =========================
                       SAVE USER IN FIRESTORE
                    ========================= */

                    await setDoc(

                        doc(
                            db,
                            "users",
                            user.uid
                        ),

                        {

                            name: name,

                            email: email,

                            userId: user.uid

                        }

                    );



                    /* SUCCESS */

                    message.innerText =
                        "Account created successfully! ✅";



                    /* GO HOME */

                    setTimeout(

                        function () {

                            window.location.href =
                                "home.html";

                        },

                        1000

                    );

                }


                catch (error) {


                    console.log(error);


                    /* =========================
                       ERROR
                    ========================= */

                    if (
                        error.code ===
                        "auth/email-already-in-use"
                    ) {

                        message.innerText =
                            "This email is already registered.";

                    }

                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        message.innerText =
                            "Please enter a valid email.";

                    }

                    else if (
                        error.code ===
                        "auth/weak-password"
                    ) {

                        message.innerText =
                            "Password is too weak.";

                    }

                    else {

                        message.innerText =
                            "Registration failed. Please try again.";

                    }

                }

            }

        );


    </script>


</body>

</html>
